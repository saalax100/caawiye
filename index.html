<html lang="so">
 <head>

  <style>
    body {
      box-sizing: border-box;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
    }

    .app-container {
      min-height: 100%;
      width: 100%;
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
      padding: 2rem;
      max-width: 480px;
      margin: 0 auto;
    }

    .input-field {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      font-size: 16px;
      transition: all 0.3s ease;
      margin-bottom: 1rem;
    }

    .input-field:focus {
      outline: none;
      border-color: #059669;
      box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1);
    }

    .btn-primary {
      width: 100%;
      padding: 16px;
      background: #059669;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-primary:hover {
      background: #047857;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(5, 150, 105, 0.3);
    }

    .btn-primary:disabled {
      background: #9ca3af;
      cursor: not-allowed;
      transform: none;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-top: 2rem;
    }

    .dashboard-btn {
      background: white;
      border: none;
      border-radius: 12px;
      padding: 1.25rem 0.75rem;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .dashboard-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
      background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
    }

    .dashboard-btn .icon {
      font-size: 2rem;
    }

    .dashboard-btn .label {
      font-size: 0.95rem;
      font-weight: 600;
      color: #1f2937;
    }

    .error-message {
      background: #fee2e2;
      color: #991b1b;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 14px;
    }

    .success-message {
      background: #d1fae5;
      color: #065f46;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 14px;
    }

    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .link-text {
      text-align: center;
      margin-top: 1.5rem;
      color: #6b7280;
    }

    .link-text a {
      color: #059669;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }

    .link-text a:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .app-container {
        padding: 0 !important;
      }

      .card {
        padding: 1.5rem 1rem;
        margin: 0.5rem;
        border-radius: 12px;
        max-width: 100%;
      }

      .dashboard-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 0.75rem;
      }

      .dashboard-btn {
        padding: 0.75rem 0.5rem;
      }

      .dashboard-btn .icon {
        font-size: 1.5rem;
      }

      .dashboard-btn .label {
        font-size: 0.75rem;
      }

      .dashboard-btn img {
        width: 45px !important;
        height: 45px !important;
      }

      h1 {
        font-size: 1.75rem !important;
      }

      h2 {
        font-size: 1.35rem !important;
      }

      .input-field {
        padding: 12px 14px;
        font-size: 15px;
      }

      .btn-primary {
        padding: 14px;
        font-size: 16px;
      }

      #productGrid {
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 0.75rem !important;
      }
    }

    @media (max-width: 480px) {
      .app-container > div {
        padding: 1rem !important;
      }

      .card {
        padding: 1rem 0.75rem;
        margin: 0.25rem;
      }
      
      .dashboard-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 0.5rem;
      }

      .dashboard-btn {
        padding: 0.65rem 0.4rem;
      }

      .dashboard-btn img {
        width: 40px !important;
        height: 40px !important;
      }

      .dashboard-btn .icon {
        font-size: 1.35rem;
      }

      .dashboard-btn .label {
        font-size: 0.7rem;
      }

      h1 {
        font-size: 1.5rem !important;
      }

      h2 {
        font-size: 1.2rem !important;
      }

      #productGrid {
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 0.5rem !important;
        padding: 0.25rem;
      }

      #productGrid > div {
        padding: 0.75rem !important;
      }

      #productGrid img {
        height: 80px !important;
      }
    }

    @media (max-width: 360px) {
      .card {
        padding: 0.75rem 0.5rem;
      }

      h1 {
        font-size: 1.35rem !important;
      }

      .input-field {
        padding: 10px 12px;
        font-size: 14px;
      }

      .btn-primary {
        padding: 12px;
        font-size: 15px;
      }
    }

    .hidden {
      display: none !important;
    }
  </style>

  <script>
    const defaultConfig = {
      app_title: "HORSEED",
      welcome_message: "Soo dhawoow HORSEED"
    };

    let allUsers = [];
    let currentUser = null;

    function loadUsersFromLocalStorage() {
      const stored = localStorage.getItem('horseed_all_users');
      if (stored) {
        allUsers = JSON.parse(stored);
      }
    }

    function saveUsersToLocalStorage() {
      localStorage.setItem('horseed_all_users', JSON.stringify(allUsers));
    }

    function initializeApp() {
      loadUsersFromLocalStorage();

      const storedUser = localStorage.getItem('horseed_current_user');
      if (storedUser) {
        currentUser = JSON.parse(storedUser);
        showDashboard();
      }
    }

    async function onConfigChange(config) {
      const appTitle = config.app_title || defaultConfig.app_title;
      const welcomeMessage = config.welcome_message || defaultConfig.welcome_message;

      document.getElementById('appTitle').textContent = appTitle;
      document.getElementById('loginAppTitle').textContent = appTitle;
      document.getElementById('welcomeMessage').textContent = welcomeMessage;
    }

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities: (config) => ({
          recolorables: [],
          borderables: [],
          fontEditable: undefined,
          fontSizeable: undefined
        }),
        mapToEditPanelValues: (config) => new Map([
          ["app_title", config.app_title || defaultConfig.app_title],
          ["welcome_message", config.welcome_message || defaultConfig.welcome_message]
        ])
      });
    }

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const phone = document.getElementById('signupPhone').value;
      const password = document.getElementById('signupPassword').value;
      const confirmPassword = document.getElementById('signupConfirmPassword').value;

      document.getElementById('signupError').classList.add('hidden');
      document.getElementById('signupSuccess').classList.add('hidden');

      if (password !== confirmPassword) {
        document.getElementById('signupError').textContent = 'Password-yada ma iswada aha!';
        document.getElementById('signupError').classList.remove('hidden');
        return;
      }

      if (password.length < 6) {
        document.getElementById('signupError').textContent = 'Password waa inuu ka badan yahay 6 xaraf!';
        document.getElementById('signupError').classList.remove('hidden');
        return;
      }

      const existingUser = allUsers.find(user => user.phone_number === phone);
      if (existingUser) {
        document.getElementById('signupError').textContent = 'Lambarkaan horay ayaa loo diiwaan geliyey!';
        document.getElementById('signupError').classList.remove('hidden');
        return;
      }

      if (allUsers.length >= 8000000) {
        document.getElementById('signupError').textContent = 'Nidaamku wuxuu galay xadka ugu sarreeya ee isticmaalayaasha. Fadlan isku day mar kale.';
        document.getElementById('signupError').classList.remove('hidden');
        return;
      }

      document.getElementById('signupButtonText').classList.add('hidden');
      document.getElementById('signupLoading').classList.remove('hidden');
      document.querySelector('#signupForm button').disabled = true;

      const newUser = {
        userId: Date.now().toString() + Math.random().toString(36).substr(2, 9),
        phone_number: phone,
        password: password,
        created_at: new Date().toISOString(),
        last_login: ""
      };

      allUsers.push(newUser);
      saveUsersToLocalStorage();

      document.getElementById('signupButtonText').classList.remove('hidden');
      document.getElementById('signupLoading').classList.add('hidden');
      document.querySelector('#signupForm button').disabled = false;

      document.getElementById('signupSuccess').textContent = 'Diiwaangalintii waa guuleysatay! Hadda login samee.';
      document.getElementById('signupSuccess').classList.remove('hidden');
      document.getElementById('signupForm').reset();
      setTimeout(() => {
        showLogin();
      }, 2000);
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const phone = document.getElementById('loginPhone').value;
      const password = document.getElementById('loginPassword').value;

      document.getElementById('loginError').classList.add('hidden');

      const user = allUsers.find(u => u.phone_number === phone && u.password === password);

      if (!user) {
        document.getElementById('loginError').textContent = 'Lambarka ama password-ka qaldan!';
        document.getElementById('loginError').classList.remove('hidden');
        return;
      }

      document.getElementById('loginButtonText').classList.add('hidden');
      document.getElementById('loginLoading').classList.remove('hidden');
      document.querySelector('#loginForm button').disabled = true;

      user.last_login = new Date().toISOString();
      saveUsersToLocalStorage();

      document.getElementById('loginButtonText').classList.remove('hidden');
      document.getElementById('loginLoading').classList.add('hidden');
      document.querySelector('#loginForm button').disabled = false;

      currentUser = user;
      localStorage.setItem('horseed_current_user', JSON.stringify(user));
      showDashboard();
    });

    document.getElementById('goToLogin').addEventListener('click', showLogin);
    document.getElementById('goToSignup').addEventListener('click', showSignup);

    document.getElementById('logoutBtn').addEventListener('click', () => {
      currentUser = null;
      localStorage.removeItem('horseed_current_user');
      showLogin();
    });

    // Products data - 61 alaab oo dhan leh sawirro xaqiiqiga ah
    const products = [
      {name: 'iPhone 15', price: '$999', icon: '📱', image: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQXJtSHEU295H48LTgCjNJ3Oa0a6ybvd-nuuA&s'},
      {name: 'Samsung Galaxy', price: '$850', icon: '📱', image: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTz6O3cAr6A13ZitURScnkAZEr-H2__st96Qw&s'},
      {name: 'Redmi Note', price: '$200', icon: '📱', image: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRWPwHdrWnP5hdtN64jwabmn9z28WgHMzM12w&s'},
      {name: 'Infinix Hot', price: '$150', icon: '📱', image: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSXMtyW4RorxAE3l6puGNj03_rJmQ7bw0_g3g&s'},
      {name: 'Vivo V30', price: '$300', icon: '📱', image: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS6xDXrCJuI_SFPu98csraHMGMIzTXRgDVDSw&s'},
      {name: 'Oppo Reno', price: '$280', icon: '📱', image: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS7NvWbajDTx_jQU63SiZPmj1zVUeputa6vUA&s'},
      {name: 'Tecno Spark', price: '$120', icon: '📱', image: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTIiTnXjLQDQU29qr3ivUSoR6NWLdlGK0W_tg&s'},

    function loadProducts() {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = '';
      
      products.forEach((product, index) => {
        const card = document.createElement('div');
        card.style.cssText = 'background: white; border: 2px solid #e5e7eb; border-radius: 12px; padding: 1rem; text-align: center; cursor: pointer; transition: all 0.3s ease;';
        card.onmouseover = () => { card.style.borderColor = '#059669'; card.style.transform = 'translateY(-4px)'; };
        card.onmouseout = () => { card.style.borderColor = '#e5e7eb'; card.style.transform = 'translateY(0)'; };
        card.onclick = () => buyProduct(product);
        
        const isRealImage = product.image.startsWith('http');
        
        card.innerHTML = `
          ${isRealImage ? 
            `<img src="${product.image}" alt="${product.name}" style="width: 100%; height: 100px; object-fit: contain; margin-bottom: 0.5rem; border-radius: 8px;" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
             <div style="font-size: 3rem; margin-bottom: 0.5rem; display: none;">${product.icon}</div>` 
            : 
            `<div style="font-size: 3rem; margin-bottom: 0.5rem;">${product.icon}</div>`
          }
          <div style="font-size: 0.85rem; font-weight: 600; color: #1f2937; margin-bottom: 0.25rem;">${product.name}</div>
          <div style="font-size: 0.9rem; color: #059669; font-weight: 700;">${product.price}</div>
        `;
        
        grid.appendChild(card);
      });
    }

    function buyProduct(product) {
      const purchaseHistory = JSON.parse(localStorage.getItem('horseed_history') || '[]');
      const purchase = {
        productName: product.name,
        productIcon: product.image,
        price: product.price,
        date: new Date().toLocaleDateString('so-SO'),
        time: new Date().toLocaleTimeString('so-SO'),
        timestamp: Date.now()
      };
      
      purchaseHistory.push(purchase);
      localStorage.setItem('horseed_history', JSON.stringify(purchaseHistory));
      
      // Ku dar histori
      const tempMessage = document.createElement('div');
      tempMessage.className = 'success-message';
      tempMessage.textContent = `✓ Waxaad dirtay dalabkan: ${product.name}`;
      tempMessage.style.cssText = 'position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; min-width: 300px;';
      document.body.appendChild(tempMessage);
      
      setTimeout(() => {
        document.body.removeChild(tempMessage);
      }, 3000);
      
      // Fur WhatsApp
      const message = `Waxaan rabaa inan dalbo:%0A%0A📦 *${product.name}*%0A💰 Qiimaha: ${product.price}%0A%0AMahadsanid!`;
      const whatsappUrl = `https://wa.me/618877686?text=${message}`;
      window.open(whatsappUrl, '_blank', 'noopener,noreferrer');
    }

    function loadHistori() {
      const historiList = document.getElementById('historiList');
      const history = JSON.parse(localStorage.getItem('horseed_history') || '[]');
      
      // Clean old entries (older than 30 days)
      const thirtyDaysAgo = Date.now() - (30 * 24 * 60 * 60 * 1000);
      const filteredHistory = history.filter(item => item.timestamp > thirtyDaysAgo);
      localStorage.setItem('horseed_history', JSON.stringify(filteredHistory));
      
      if (filteredHistory.length === 0) {
        historiList.innerHTML = '<p style="text-align: center; color: #6b7280; padding: 2rem;">Wax histori ah ma jiraan</p>';
        return;
      }
      
      historiList.innerHTML = '';
      filteredHistory.reverse().forEach(item => {
        const card = document.createElement('div');
        card.style.cssText = 'background: #f9fafb; border-radius: 12px; padding: 1rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 1rem;';
        
        const isRealImage = item.productIcon && item.productIcon.startsWith('http');
        
        card.innerHTML = `
          ${isRealImage ? 
            `<img src="${item.productIcon}" alt="${item.productName}" style="width: 80px; height: 80px; object-fit: contain; border-radius: 8px;" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
             <div style="font-size: 3rem; display: none;">📦</div>` 
            : 
            `<div style="font-size: 3rem;">📦</div>`
          }
          <div style="flex: 1;">
            <div style="font-weight: 600; color: #1f2937; margin-bottom: 0.25rem;">${item.productName}</div>
            <div style="font-size: 0.9rem; color: #6b7280;">${item.date} - ${item.time}</div>
          </div>
          <div style="font-weight: 700; color: #059669; font-size: 1.1rem;">${item.price}</div>
        `;
        
        historiList.appendChild(card);
      });
    }
