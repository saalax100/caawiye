<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Invest App Multiuser</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom right,#001f3f,#001f3f );
      margin: 0; padding: 20px;
    }
    .container {
      max-width: 500px;
      margin: auto;
      background: #001f3f;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      color: white;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      border-radius: 5px;
      border: none;
      font-weight: bold;
    }
    input, select { border: 1px solid #fff; color: black; }
    button {
      background: white; color: black;
      cursor: pointer; transition: 0.3s;
    }
    button:hover { background: yellow; color: black; }
    img {
      width: 100%; max-height: 100px;
      object-fit: contain; border-radius: 10px; margin-bottom: 10px;
    }
    p { color: #00e600; cursor: pointer; margin-top: 10px; }
    p:hover { text-decoration: underline; }
    .robot-active {
      background:   #00e600; color: black;
      font-size: 0.9em; padding: 4px; border-radius: 4px;
      margin-bottom: 10px; display: inline-block;
    }
    .robot-info { font-size: 0.9em; margin-bottom: 10px; }
    .balance-display {
      display: flex; align-items: center;
      gap: 10px; margin-bottom: 10px;
    }
    .balance-display img {
      width: 60px; height: auto; margin: 0; border-radius: 5px;
    }
  </style>
</head>
<body>
<div class="container" id="app">
  <h2 style="text-align:center;">Loading...</h2>
</div>

<script>
const robotConfigs = [
  { price: 400, reward: 8.0 },
  { price: 350, reward: 7.5 },
  { price: 320, reward: 7.2 },
  { price: 290, reward: 5.8 },
  { price: 260, reward: 4.6 },
  { price: 230, reward: 4.3 },
  { price: 210, reward: 4.1 },
  { price: 190, reward: 2.9 },
  { price: 160, reward: 2.6 },
  { price: 140, reward: 2.4 },
  { price: 130, reward: 2.3 },
  { price: 120, reward: 2.2 },
  { price: 110, reward: 2.1 },
  { price: 105, reward: 2.05 },
  { price: 70,  reward: 1.3 },
  { price: 60,  reward: 1.15 },
  { price: 50,  reward: 1.05 },
  { price: 40,  reward: 1.00 },
  { price: 30,  reward: 0.35 },
  { price: 20,  reward: 0.25 },
  { price: 10,  reward: 0.2 },
  { price: 5,   reward: 0.17 },
  { price: 3,   reward: 0.15 },
  { price: 2,   reward: 0.1 },
  { price: 1,   reward: 0.05 }
];

const robotImages = {
  400: 'https://i.postimg.cc/qMsb0YVN/download.jpg',
  350: 'https://i.postimg.cc/zBY79Stn/download.jpg',
  320: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQfrxHTIIavs0-qKvh0tQX6Z7Wrxp_uCcqEvA&s',
  290: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS8cyHDMP2qcbCt9uEkRLVJnhJizQqjU2E9_A&s',
  260: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTawnuq7dYbMknDWK3S0hW4dfU4gPE9Q-CiPg&s',
  230: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSWWEWSgS7rgftsWS9IDu_bsNDbHNL_lXqCYw&s',
  210: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRI5665g09njCc5hSex8zYqVnc9GRPRzQUAwQ&s',
  190: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSKvNhp4PfTohjZGLSVXH-Qi9Nf7pMHqfjcRQ&s',
  160: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR-QyYtNHX5_KeVsbVUWAYTU8LH-5nvzoR7hA&s',
  140: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQIYYo6QV_fHBt0-CZztNMhP35jcTMcN4htQg&s',
  130: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRerZ3uGIRvEDMdGG4H6J_Vk-NpShPWy1XjYQ&s',
  120: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSxS_BTvYUXRyMJAwDnm1NPMNBI-k2JxACozQ&s',
  110: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSjTVpebSMoYsz-4uRQzNfRHQ95mlNuuhLCkA&s',
  105: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTKAUU6PvsKkkDkCVlUyXAN7fuG9R8PKmzOZw&s',
  100: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRNTq6oOe3fDQKaTtbOnFRE8wtW_e3ODqZqBA&s',
  70:  'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTXEEJO8-rPqD0Ga-7eCAJUHjkTqGp8MJhK1Q&s',
  60:  'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRmcjks0tN8_atnC70Xd0wLs7ot_TKq4Sizkg&s',
  50:  'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSS9rLO06Lbtf8lchwcJp6v5O4ZkiYzqfgwxQ&s',
  40:  'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRFYm3UZUrgYI_rjM98jrOQ6g-qNuDBXWorxw&s',
  30:  'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQQ1EQ348qCXIs92c3homsL78niVFx2AVc70w&s',
  20:  'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSN4G5ptOpk_DoU_1z2S1tdvPttRVTXeHJDTQ&s',
  10:  'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSN4G5ptOpk_DoU_1z2S1tdvPttRVTXeHJDTQ&s',
  5:   'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTAoVzmXU7LH_hLgJzJefWYDwrzFxghR45jsw&s',
  3:   'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS2MSIsq7GlsBn3EZ0xquGAOGYZSfHzDitxeg&s',
  2:   'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQR-yPX4p9ehOFmn70JBXewNUwBaYi0steV4g&s',
  1:   'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQfiO7agvs5Xg3uKg-u0FIahDpYwib8Fj6giA&s'
};

let user = null;

function saveUsers(users) {
  localStorage.setItem("investUsers", JSON.stringify(users));
}

function loadUsers() {
  return JSON.parse(localStorage.getItem("investUsers")) || [];
}

function saveCurrentUser() {
  let users = loadUsers();
  const index = users.findIndex(u => u.number === user.number);
  if (index > -1) {
    users[index] = user;
    saveUsers(users);
  }
}

function showLogin() {
  app.innerHTML = `
    <h2>Login</h2>
    <input id="loginNumber" placeholder="Phone Number" />
    <input id="loginPassword" type="password" placeholder="Password" />
    <button onclick="doLogin()">Login</button>
    <p onclick="showRegister()">Don't have an account? <u>Register</u></p>
  `;
}

function showRegister() {
  app.innerHTML = `
    <h2>Register</h2>
    <input id="regNumber" placeholder="Phone Number" />
    <input id="regPassword" type="password" placeholder="Password" />
    <input id="regConfirm" type="password" placeholder="Confirm Password" />
    <button onclick="doRegister()">Register</button>
    <p onclick="showLogin()">Already have an account? <u>Login</u></p>
  `;
}

function doRegister() {
  const number = document.getElementById("regNumber").value.trim();
  const pass = document.getElementById("regPassword").value;
  const confirm = document.getElementById("regConfirm").value;

  if (!number || !pass || !confirm) {
    return Swal.fire("Fadlan buuxi dhammaan foomka", "", "warning");
  }
  if (pass !== confirm) {
    return Swal.fire("Khalad", "Password-ku isma lahan", "error");
  }

  let users = loadUsers();
  if (users.some(u => u.number === number)) {
    return Swal.fire("Error", "Lambarkan hore ayaa loo diiwaan galiyay", "error");
  }

  user = { number, password: pass, balance: 0, mining: null };
  users.push(user);
  saveUsers(users);
  localStorage.setItem("loggedInUserNumber", number);

  Swal.fire("Success", "Account-ka waa la sameeyay!", "success").then(() => {
    showDashboard();
    startMining();
  });
}

function doLogin() {
  const number = document.getElementById("loginNumber").value.trim();
  const pass = document.getElementById("loginPassword").value;
  const users = loadUsers();

  const found = users.find(u => u.number === number && u.password === pass);
  if (!found) {
    return Swal.fire("Fashil", "Number ama Password khaldan", "error");
  }

  user = found;
  localStorage.setItem("loggedInUserNumber", number);

  Swal.fire("Guuleysi", "Login guuleystay!", "success").then(() => {
    showDashboard();
    startMining();
  });
}

function logout() {
  localStorage.removeItem("loggedInUserNumber");
  user = null;
  Swal.fire("Macsalaama", "akonkaaga waad kabaxday ", "info").then(() => {
    showLogin();
  });
}

function showDashboard() {
  let html = `
    <h2>Dashboard</h2>
    <div class="balance-display">
      <img src="evcplus.png.jpg" alt="EVC Plus" style="height: 60px; margin-left: 10px;" />
      <span><strong>Balance:</strong> $${user.balance.toFixed(2)}</span>
    </div>
  `;

  robotConfigs.forEach(r => {
    const isActive = user.mining && user.mining.active && user.mining.price === r.price;
    const activeLabel = isActive ? '<div class="robot-active">Active</div>' : '';
    const timeLeftHtml = isActive
      ? `<div class="robot-info">Started: ${new Date(user.mining.startTime).toLocaleString()}<br>Time Left: <span id="timeLeft">Calculating...</span></div>`
      : '';

    html += `
      <img src="${robotImages[r.price] || ''}" alt="Robot $${r.price}" />
      ${activeLabel}
      ${timeLeftHtml}
      <button onclick="buyRobot(${r.price}, ${r.reward})" ${isActive ? 'disabled' : ''}>
        iibso hada $${r.price} (Earns $${r.reward}/lacagta lafilayo)
      </button>
    `;
  });

  html += `
    <button onclick="showDeposit()">Deposit</button>
    <button onclick="showWithdraw()">Withdraw</button>
    <button onclick="sendUSSD()">USSD Payment</button>
    <button onclick="sendWhatsApp()">Contact via WhatsApp</button>
    <button onclick="logout()">Logout</button>
  `;

  app.innerHTML = html;
  if (user.mining && user.mining.active) updateTimeLeft();
}

function buyRobot(price, reward) {
  if (user.balance < price) {
    return Swal.fire("Digniin", "Lacagtaadu kuma filna si aad u iibsato qeyb-tan.", "warning");
  }
  if (user.mining && user.mining.active) {
    return Swal.fire("Digniin", "hada ganacsi ayaad kujirtaa  . Sug inta uu dhamaanayo.", "info");
  }

  Swal.fire({
    title: "Ma hubtaa?",
    text: `Waxaad rabtaa inaad kubiirto kaganacsiga digaaga iyo unkunta  $${price}, waxaad kubiirtay shirkada kaganacsata digaaga iyo ukunta ee HORSEED $${reward} mahatsanid.`,
    icon: "question",
    showCancelButton: true,
    confirmButtonText: "Haa, iibso!",
    cancelButtonText: "Maya"
  }).then(result => {
    if (result.isConfirmed) {
      user.balance -= price;
      user.mining = { price, reward, startTime: Date.now(), active: true };
      saveCurrentUser();
      Swal.fire("Guul", "waad kuguuleysatay!", "success").then(() => {
        showDashboard();
        startMining();
      });
    }
  });
}

function showDeposit() {
  app.innerHTML = `
    <h2>Deposit</h2>
    <select id="depositMethod">
      <option value="mobile">Mobile Number</option>
      <option value="crypto">Crypto Address</option>
    </select>
    <input id="amount" placeholder="Enter Amount" />
    <input id="identifier" placeholder="Enter Mobile Number or Crypto Address" />
    <input type="file" />
    <button onclick="confirmDeposit()">Confirm</button>
    <button onclick="showDashboard()">Back</button>
  `;
}

function confirmDeposit() {
  const amount = parseFloat(document.getElementById("amount").value);
  const method = document.getElementById("depositMethod").value;
  const identifier = document.getElementById("identifier").value.trim();

  if (!amount || !identifier) {
    return Swal.fire("Fadlan buuxi foomka deposit-ka", "", "warning");
  }

  user.balance += amount;
  saveCurrentUser();

  const msg = `Waxaan soo maalgashaday $${amount} anigoo isticmaalaya ${method === 'mobile' ? 'Mobile Number' : 'Crypto Address'}: ${identifier}`;
  window.open(`https://wa.me/252618877686?text=${encodeURIComponent(msg)}`, "_blank");

  showDashboard();
}

function showWithdraw() {
  app.innerHTML = `
    <h2>Withdraw</h2>
    <select id="withdrawMethod">
      <option value="mobile">Mobile Number</option>
      <option value="crypto">Crypto Address</option>
    </select>
    <input id="amount" placeholder="Enter Amount" />
    <input id="identifier" placeholder="Enter Mobile Number or Crypto Address" />
    <button onclick="confirmWithdraw()">Confirm</button>
    <button onclick="showDashboard()">Back</button>
  `;
}

function confirmWithdraw() {
  const amount = parseFloat(document.getElementById("amount").value);
  const method = document.getElementById("withdrawMethod").value;
  const identifier = document.getElementById("identifier").value.trim();

  if (!amount || amount > user.balance) {
    return Swal.fire("Error", "Lacag kuma filna balance-kaaga.", "error");
  }
  if (!identifier) {
    return Swal.fire("Fadlan gali faahfaahinta Mobile Number ama Crypto Address", "", "warning");
  }

  user.balance -= amount;
  saveCurrentUser();

  const msg = `Waxaan la baxay $${amount} anigoo  isticmaalaya ${method === 'mobile' ? 'Mobile Number' : 'Crypto Address'}: ${identifier}`;
  window.open(`https://wa.me/252618877686?text=${encodeURIComponent(msg)}`, "_blank");

  showDashboard();
}

function sendUSSD() {
  const amount = prompt("waxaad joogtaa qeybta lacag dirida ee shirkada HORSEED ogow shirkadan waxa ay kaganacsataa digaaga iyo ukunta milkiga iyo maamulka shirkadan waa mudane bile cabdixakiin maxamed hadii aad diyaar utahay ganacsi fudud oo aad kafaaidi karto ciyowna kobci kara fadlan kubiir shirkadan.Fadlan geli lacagta aad rabto inaad dirto:");
  if (!amount || isNaN(amount)) return Swal.fire("Fadlan geli lacag sax ah", "", "warning");
  const code = `*712*618877686*${amount}#`;
  window.location.href = `tel:${encodeURIComponent(code)}`;
}

function sendWhatsApp() {
  const msg = `waan ku salaamay, waxaan rabaa caawimaad ku saabsan app-ka HRSD. Fadlan iigu soo jawaab.`;
  window.open(`https://wa.me/252618877686?text=${encodeURIComponent(msg)}`, "_blank");
}

function startMining() {
  if (!user.mining || !user.mining.active) return;
  updateTimeLeft();
  setTimeout(startMining, 1000);
}

function updateTimeLeft() {
  if (!user.mining || !user.mining.active) return;

  const now = Date.now();
  const elapsed = now - user.mining.startTime;
  const oneDayMs = 24 * 60 * 60 * 1000;
  const remaining = oneDayMs - elapsed;

  if (remaining <= 0) {
    user.balance += user.mining.reward + user.mining.price;
    user.mining.active = false;
    saveCurrentUser();
    Swal.fire("Robot Finished", "robotka shaqadii waa uu dhameeyey fadlan dib ukireyso oo dalbo robotka sii uu shaqadii kuugu sii wado ogo waxaad heshay oo akoonkaaga laguugu shubay lacagtaadii iyo faaidadii aad badeecada ka heshay mahadsanid .", "info").then(() => {
      showDashboard();
    });
    return;
  }

  const hours = Math.floor(remaining / (1000 * 60 * 60));
  const minutes = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
  const seconds = Math.floor((remaining % (1000 * 60)) / 1000);

  const timeLeftElem = document.getElementById("timeLeft");
  if (timeLeftElem) {
    timeLeftElem.textContent = `${hours}h ${minutes}m ${seconds}s`;
  }
}

setTimeout(() => {
  const loggedNumber = localStorage.getItem("loggedInUserNumber");
  const users = loadUsers();
  if (loggedNumber) {
    user = users.find(u => u.number === loggedNumber);
    if (user) {
      showDashboard();
      startMining();
      return;
    }
  }
  showLogin();
}, 500);
</script>
</body>
</html>
