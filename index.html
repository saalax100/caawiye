  <style>
    body {
      box-sizing: border-box;
    }
    
    * {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .balance-card {
      background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 100%);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.18);
    }

    .btn-action {
      transition: all 0.3s ease;
    }

    .btn-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    .success-animation {
      animation: scaleIn 0.5s ease-out;
    }

    @keyframes scaleIn {
      0% {
        transform: scale(0);
        opacity: 0;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .spinner {
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .crypto-icon {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    .robot-active-badge {
      display: inline-block;
      background: linear-gradient(135deg, #10b981, #059669);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .price-chart {
      position: relative;
      height: 200px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      overflow: hidden;
    }

    .price-line {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 50%;
      stroke: #10b981;
      stroke-width: 2;
      fill: none;
      animation: drawLine 2s ease-in-out infinite;
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>

    // LocalStorage Functions
    function saveToLocalStorage() {
      localStorage.setItem('daacad_users', JSON.stringify(allUsers));
      localStorage.setItem('daacad_counter', userIdCounter.toString());
    }

    function loadFromLocalStorage() {
      const usersData = localStorage.getItem('daacad_users');
      const counterData = localStorage.getItem('daacad_counter');
      
      if (usersData) {
        allUsers = JSON.parse(usersData);
      }
      
      if (counterData) {
        userIdCounter = parseInt(counterData);
      }
    }

    async function onConfigChange(config) {
      document.getElementById('app-title-signup').textContent = config.app_title || defaultConfig.app_title;
      document.getElementById('app-title-login').textContent = config.app_title || defaultConfig.app_title;
      document.getElementById('app-title-dashboard').textContent = config.app_title || defaultConfig.app_title;
      document.getElementById('signup-heading').textContent = config.signup_title || defaultConfig.signup_title;
      document.getElementById('login-heading').textContent = config.login_title || defaultConfig.login_title;
      document.getElementById('dashboard-heading').textContent = config.dashboard_title || defaultConfig.dashboard_title;

      const primaryColor = config.primary_color || defaultConfig.primary_color;
      const secondaryColor = config.secondary_color || defaultConfig.secondary_color;
      const successColor = config.success_color || defaultConfig.success_color;
      const textColor = config.text_color || defaultConfig.text_color;
      const buttonColor = config.button_color || defaultConfig.button_color;

      document.querySelectorAll('.btn-primary').forEach(btn => {
        btn.style.backgroundColor = buttonColor;
      });

      document.querySelectorAll('.text-primary').forEach(el => {
        el.style.color = primaryColor;
      });

      document.querySelectorAll('.success-check').forEach(el => {
        el.style.color = successColor;
      });
    }

    async function init() {
      loadFromLocalStorage();

      if (window.elementSdk) {
        window.elementSdk.init({
          defaultConfig,
          onConfigChange,
          mapToCapabilities: (config) => ({
            recolorables: [
              {
                get: () => config.primary_color || defaultConfig.primary_color,
                set: (value) => {
                  window.elementSdk.config.primary_color = value;
                  window.elementSdk.setConfig({ primary_color: value });
                }
              },
              {
                get: () => config.secondary_color || defaultConfig.secondary_color,
                set: (value) => {
                  window.elementSdk.config.secondary_color = value;
                  window.elementSdk.setConfig({ secondary_color: value });
                }
              },
              {
                get: () => config.success_color || defaultConfig.success_color,
                set: (value) => {
                  window.elementSdk.config.success_color = value;
                  window.elementSdk.setConfig({ success_color: value });
                }
              },
              {
                get: () => config.text_color || defaultConfig.text_color,
                set: (value) => {
                  window.elementSdk.config.text_color = value;
                  window.elementSdk.setConfig({ text_color: value });
                }
              },
              {
                get: () => config.button_color || defaultConfig.button_color,
                set: (value) => {
                  window.elementSdk.config.button_color = value;
                  window.elementSdk.setConfig({ button_color: value });
                }
              }
            ],
            borderables: [],
            fontEditable: undefined,
            fontSizeable: undefined
          }),
          mapToEditPanelValues: (config) => new Map([
            ["app_title", config.app_title || defaultConfig.app_title],
            ["signup_title", config.signup_title || defaultConfig.signup_title],
            ["login_title", config.login_title || defaultConfig.login_title],
            ["dashboard_title", config.dashboard_title || defaultConfig.dashboard_title]
          ])
        });
      }

      renderApp();
      startRobotChecker();
    }

    function handleRobotSend() {
      const amountInput = parseFloat(document.getElementById('robot-amount-input').value);
      const idInput = document.getElementById('robot-id-input').value.trim();
      const errorEl = document.getElementById('robot-form-error');

      if (!amountInput || !idInput) {
        errorEl.textContent = 'Fadlan buuxi dhammaan qeybaha';
        errorEl.classList.remove('hidden');
        return;
      }

      if (idInput !== currentUser.user_id) {
        errorEl.textContent = 'ID code-ka waa qalad';
        errorEl.classList.remove('hidden');
        return;
      }

      const rewardEntry = ROBOT_REWARDS.find(r => r.price === amountInput);
      if (!rewardEntry) {
        errorEl.textContent = 'Qadarka ma aha mid sax ah. Tusaale: $1, $5, $10, $20...';
        errorEl.classList.remove('hidden');
        return;
      }

      if (currentUser.balance_usdt < amountInput) {
        errorEl.textContent = 'Balance kama filna';
        errorEl.classList.remove('hidden');
        return;
      }

      if (currentUser.robot_active) {
        errorEl.textContent = 'Robot wuu shaqeynayaa. Sugayso ilaa 24 saac dhamaato';
        errorEl.classList.remove('hidden');
        return;
      }

      document.getElementById('robot-send-text').style.display = 'none';
      document.getElementById('robot-send-spinner').classList.remove('hidden');

      const startTime = new Date();
      const endTime = new Date(startTime.getTime() + 24 * 60 * 60 * 1000);

      currentUser.balance_usdt = parseFloat(currentUser.balance_usdt) - amountInput;
      currentUser.robot_active = true;
      currentUser.robot_amount = amountInput;
      currentUser.robot_reward = rewardEntry.reward;
      currentUser.robot_start_time = startTime.toISOString();
      currentUser.robot_end_time = endTime.toISOString();

      updateUserInLocalStorage(currentUser);
      
      document.getElementById('robot-send-text').style.display = 'inline';
      document.getElementById('robot-send-spinner').classList.add('hidden');
      
      document.getElementById('robot-amount-input').value = '';
      document.getElementById('robot-id-input').value = '';
      errorEl.classList.add('hidden');
      showRobotActiveDisplay();
    }

    function updateRobotDisplay() {
      if (!currentUser || !currentUser.robot_active) return;

      const now = new Date();
      const endTime = new Date(currentUser.robot_end_time);
      const remaining = endTime - now;

      if (remaining <= 0) {
        return;
      }

      const hours = Math.floor(remaining / (60 * 60 * 1000));
      const minutes = Math.floor((remaining % (60 * 60 * 1000)) / (60 * 1000));
      const seconds = Math.floor((remaining % (60 * 1000)) / 1000);

      document.getElementById('robot-timer-display').textContent = 
        `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

      document.getElementById('robot-date-display').textContent = now.toLocaleString('so-SO', {
        year: 'numeric',
        month: 'long',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });

      document.getElementById('robot-investment-display').textContent = `$${currentUser.robot_amount.toFixed(2)}`;
      document.getElementById('robot-reward-display').textContent = `$${currentUser.robot_reward.toFixed(2)}`;
      document.getElementById('robot-total-return').textContent = `$${(currentUser.robot_amount + currentUser.robot_reward).toFixed(2)}`;
    }

    function startRobotChecker() {
      robotCheckInterval = setInterval(() => {
        if (!currentUser || !currentUser.robot_active) return;

        const now = new Date();
        const endTime = new Date(currentUser.robot_end_time);

        if (now >= endTime) {
          const totalPayout = currentUser.robot_amount + currentUser.robot_reward;
          
          currentUser.balance_usdt = parseFloat(currentUser.balance_usdt) + totalPayout;
          currentUser.robot_active = false;
          currentUser.robot_amount = 0;
          currentUser.robot_reward = 0;
          currentUser.robot_start_time = '';
          currentUser.robot_end_time = '';

          updateUserInLocalStorage(currentUser);
          renderDashboard();
        }
      }, 1000);

      setInterval(() => {
        if (currentUser && currentUser.robot_active) {
          const modalVisible = !document.getElementById('robot-modal').classList.contains('hidden');
          const activeDisplayVisible = !document.getElementById('robot-active-display').classList.contains('hidden');
          
          if (modalVisible && activeDisplayVisible) {
            updateRobotDisplay();
          }
        }
      }, 1000);
    }

        return;
      }

      const existingUser = allUsers.find(u => u.name === name);
      if (existingUser) {
        showError('signup', 'Magacan waa la isticmaalay');
        return;
      }

      showLoading('signup', true);
      hideError('signup');

      const userId = `ID${userIdCounter++}`;
      const newUser = {
        user_id: userId,
        name,
        number,
        password,
        balance_usdt: 0.00,
        balance_hrsd: 0.000,
        balance_bitcoin: 0.00000,
        created_at: new Date().toISOString(),
        robot_active: false,
        robot_amount: 0,
        robot_reward: 0,
        robot_start_time: '',
        robot_end_time: ''
      };

      allUsers.push(newUser);
      saveToLocalStorage();

      showLoading('signup', false);
      document.getElementById('signup-success').classList.remove('hidden');
      setTimeout(() => {
        document.getElementById('signup-success').classList.add('hidden');
        document.getElementById('signup-form').reset();
        showLogin();
      }, 2000);
    }

    function handleLogin(e) {
      e.preventDefault();

      const name = document.getElementById('login-name').value.trim();
      const password = document.getElementById('login-password').value;

      const user = allUsers.find(u => u.name === name && u.password === password);

      if (!user) {
        showError('login', 'Magaca ama password-ka waa qalad');
        return;
      }

      showLoading('login', true);
      hideError('login');

      setTimeout(() => {
        showLoading('login', false);
        document.getElementById('login-success').classList.remove('hidden');
        
        setTimeout(() => {
          document.getElementById('login-success').classList.add('hidden');
          currentUser = user;
          showDashboard();
        }, 2000);
      }, 500);
    }

    function showDashboard() {
      document.getElementById('signup-view').style.display = 'none';
      document.getElementById('login-view').style.display = 'none';
      document.getElementById('dashboard-view').style.display = 'block';
      renderDashboard();
      checkRobotStatus();
    }

    function renderDashboard() {
      if (!currentUser) return;

      document.getElementById('user-id-display').textContent = currentUser.user_id;
      document.getElementById('user-name-display').textContent = currentUser.name;
      document.getElementById('balance-usdt').textContent = currentUser.balance_usdt.toFixed(2);
      document.getElementById('balance-hrsd').textContent = currentUser.balance_hrsd.toFixed(3);
      document.getElementById('balance-bitcoin').textContent = currentUser.balance_bitcoin.toFixed(5);
    }

    function handleLogout() {
      currentUser = null;
      document.getElementById('login-form').reset();
      showLogin();
    }

    function showSignup() {
      document.getElementById('login-view').classList.add('hidden');
      document.getElementById('signup-view').classList.remove('hidden');
      document.getElementById('dashboard-view').style.display = 'none';
    }

    function showLogin() {
      document.getElementById('signup-view').classList.add('hidden');
      document.getElementById('login-view').classList.remove('hidden');
      document.getElementById('dashboard-view').style.display = 'none';
    }

    function showLoading(form, show) {
      const btnText = document.getElementById(`${form}-btn-text`);
      const spinner = document.getElementById(`${form}-spinner`);
      
      if (show) {
        btnText.style.display = 'none';
        spinner.classList.remove('hidden');
      } else {
        btnText.style.display = 'inline';
        spinner.classList.add('hidden');
      }
    }

    function showError(form, message) {
      const errorEl = document.getElementById(`${form}-error`);
      errorEl.textContent = message;
      errorEl.classList.remove('hidden');
    }

    function hideError(form) {
      document.getElementById(`${form}-error`).classList.add('hidden');
    }

    function updateUserInLocalStorage(user) {
      const userIndex = allUsers.findIndex(u => u.user_id === user.user_id);
      if (userIndex !== -1) {
        allUsers[userIndex] = user;
        saveToLocalStorage();
      }
    }

    // Live Trade Functions
    function startLiveTrades() {
      const liveTradesContainer = document.getElementById('live-trades');
      const names = ['Ahmed', 'Fatima', 'Mohamed', 'Amina', 'Hassan', 'Zahra', 'Ali', 'Khadija', 'Omar', 'Aisha','Mokhtar','Bile','Ubax','Iqro'];
      
      const trades = [];
      for (let i = 0; i < 110; i++) {
        trades.push(generateRandomTrade(names));
      }
      
      trades.forEach(trade => {
        liveTradesContainer.insertAdjacentHTML('afterbegin', trade);
      });

      liveTradesInterval = setInterval(() => {
        const newTrade = generateRandomTrade(names);
        liveTradesContainer.insertAdjacentHTML('afterbegin', newTrade);
        
        const allTrades = liveTradesContainer.children;
        if (allTrades.length > 120) {
          liveTradesContainer.removeChild(allTrades[allTrades.length - 1]);
        }
      }, 2000);
    }

    function generateRandomTrade(names) {
      const name = names[Math.floor(Math.random() * names.length)];
      const isUp = Math.random() > 0.5;
      const amount = (Math.random() * 100 + 1).toFixed(3);
      const price = currentHrsdPrice.toFixed(4);
      const arrow = isUp ? '▲' : '▼';
      const color = isUp ? 'text-green-400' : 'text-red-400';
      
      return `
        <div class="flex items-center justify-between py-2 border-b border-white border-opacity-10">
          <div class="flex items-center gap-2">
            <img src="https://i.postimg.cc/MHRsF2V2/images-(2).png" alt="USDT" class="w-3 h-3" onerror="this.style.display='none';">
            <img src="https://i.postimg.cc/Hs8HTV40/IMG-.-497.jpg" alt="HRSD" class="w-3 h-3" onerror="this.style.display='none';">
            <span class="text-white text-sm">${name}</span>
          </div>
          <div class="text-right">
            <p class="${color} text-sm font-bold">${arrow} ${amount} HRSD</p>
            <p class="text-gray-400 text-xs">@ $${price}</p>
          </div>
        </div>
      `;
    }

    function stopLiveTrades() {
      if (liveTradesInterval) {
        clearInterval(liveTradesInterval);
        liveTradesInterval = null;
      }
      document.getElementById('live-trades').innerHTML = '';
    }

    // Price Fluctuation Functions
    function startPriceFluctuation() {
      updatePriceDisplay();
      
      priceFluctuationInterval = setInterval(() => {
        const changePercent = (Math.random() * 4 - 2) / 100;
        const oldPrice = currentHrsdPrice;
        currentHrsdPrice = currentHrsdPrice * (1 + changePercent);
        
        if (currentHrsdPrice < 0.08) currentHrsdPrice = 0.08;
        if (currentHrsdPrice > 0.20) currentHrsdPrice = 0.20;
        
        updatePriceDisplay();
        
        if (currentUser && currentUser.balance_hrsd > 0 && isTrading) {
          const priceChange = currentHrsdPrice - oldPrice;
          const percentChange = priceChange / oldPrice;
          
          if (priceChange > 0) {
            const profit = currentUser.balance_hrsd * percentChange * 0.75;
            currentUser.balance_hrsd = parseFloat(currentUser.balance_hrsd) + profit;
            updateUserInLocalStorage(currentUser);
            updateTradingStatus();
          } else if (priceChange < 0) {
            const loss = currentUser.balance_hrsd * Math.abs(percentChange) * 0.65;
            currentUser.balance_hrsd = Math.max(0, parseFloat(currentUser.balance_hrsd) - loss);
            updateUserInLocalStorage(currentUser);
            updateTradingStatus();
          }
        }
      }, 3000);
    }

    function stopPriceFluctuation() {
      if (priceFluctuationInterval) {
        clearInterval(priceFluctuationInterval);
        priceFluctuationInterval = null;
      }
      isTrading = false;
    }

    function updatePriceDisplay() {
      document.getElementById('current-price').textContent = `$${currentHrsdPrice.toFixed(4)}`;
      
      const percentChange = ((currentHrsdPrice - 0.31) / 0.31) * 100;
      const priceChangeEl = document.getElementById('price-change');
      
      if (percentChange > 0) {
        priceChangeEl.textContent = `+${percentChange.toFixed(2)}%`;
        priceChangeEl.className = 'text-green-400 font-bold';
      } else {
        priceChangeEl.textContent = `${percentChange.toFixed(2)}%`;
        priceChangeEl.className = 'text-red-400 font-bold';
      }
    }

    function updateTradingStatus() {
      if (currentUser && currentUser.balance_hrsd > 0) {
        isTrading = true;
        document.getElementById('trading-status').classList.remove('hidden');
        document.getElementById('hrsd-holdings').textContent = currentUser.balance_hrsd.toFixed(3) + ' HRSD';
        
        const currentValue = currentUser.balance_hrsd * currentHrsdPrice;
        document.getElementById('current-value-usd').textContent = '$' + currentValue.toFixed(2);
      } else {
        isTrading = false;
        document.getElementById('trading-status').classList.add('hidden');
      }
    }

    function handleBuy() {
      const buyAmountInput = document.getElementById('buy-amount').value;
      
      if (!buyAmountInput || parseFloat(buyAmountInput) <= 0) {
        return;
      }

      const buyAmount = parseFloat(buyAmountInput);
      
      if (buyAmount > currentUser.balance_usdt) {
        return;
      }

      const hrsdAmount = buyAmount / currentHrsdPrice;
      
      currentUser.balance_usdt = parseFloat(currentUser.balance_usdt) - buyAmount;
      currentUser.balance_hrsd = parseFloat(currentUser.balance_hrsd) + hrsdAmount;
      
      updateUserInLocalStorage(currentUser);
      document.getElementById('buy-amount').value = '';
      document.getElementById('buy-balance').textContent = currentUser.balance_usdt.toFixed(2);
      updateTradingStatus();
    }

    function handleSell() {
      if (!currentUser || currentUser.balance_hrsd <= 0) {
        return;
      }

      const usdtAmount = currentUser.balance_hrsd * currentHrsdPrice;
      
      currentUser.balance_usdt = parseFloat(currentUser.balance_usdt) + usdtAmount;
      currentUser.balance_hrsd = 0;
      
      updateUserInLocalStorage(currentUser);
      document.getElementById('buy-balance').textContent = currentUser.balance_usdt.toFixed(2);
      updateTradingStatus();
      isTrading = false;
    }

    // Swap Functions
    const swapRates = {
      usdt: 1,
      bitcoin: 45000,
      hrsd: 0.12
    };

    const swapIcons = {
      usdt: 'https://i.postimg.cc/MHRsF2V2/images-(2).png',
      bitcoin: 'https://i.postimg.cc/4d44VSWt/images-(1).png',
      hrsd: 'https://i.postimg.cc/Hs8HTV40/IMG-.-497.jpg'
    };

    function updateSwapIcon(type) {
      const currency = document.getElementById(`swap-${type}`).value;
      const icon = document.getElementById(`swap-${type}-icon`);
      icon.src = swapIcons[currency];
      icon.alt = getCurrencyName(currency);
    }

    function calculateSwapAmount() {
      const fromCurrency = document.getElementById('swap-from').value;
      const toCurrency = document.getElementById('swap-to').value;
      const fromAmount = parseFloat(document.getElementById('swap-from-amount').value) || 0;
      
      if (fromAmount > 0) {
        const usdValue = fromAmount * swapRates[fromCurrency];
        const toAmount = usdValue / swapRates[toCurrency];
        document.getElementById('swap-to-amount').textContent = toAmount.toFixed(5);
      } else {
        document.getElementById('swap-to-amount').textContent = '0.00';
      }
    }

    function getCurrencyName(code) {
      const names = {
        usdt: 'USDT',
        bitcoin: 'Bitcoin',
        hrsd: 'HRSD.COIN'
      };
      return names[code];
    }

    function handleSwap() {
      const fromCurrency = document.getElementById('swap-from').value;
      const toCurrency = document.getElementById('swap-to').value;
      const fromAmount = parseFloat(document.getElementById('swap-from-amount').value);
      
      if (!fromAmount || fromAmount <= 0) {
        return;
      }

      let hasBalance = false;
      if (fromCurrency === 'usdt' && currentUser.balance_usdt >= fromAmount) hasBalance = true;
      if (fromCurrency === 'bitcoin' && currentUser.balance_bitcoin >= fromAmount) hasBalance = true;
      if (fromCurrency === 'hrsd' && currentUser.balance_hrsd >= fromAmount) hasBalance = true;

      if (!hasBalance) {
        return;
      }

      const usdValue = fromAmount * swapRates[fromCurrency];
      const toAmount = usdValue / swapRates[toCurrency];
      
      if (fromCurrency === 'usdt') currentUser.balance_usdt -= fromAmount;
      if (fromCurrency === 'bitcoin') currentUser.balance_bitcoin -= fromAmount;
      if (fromCurrency === 'hrsd') currentUser.balance_hrsd -= fromAmount;
      
      if (toCurrency === 'usdt') currentUser.balance_usdt += toAmount;
      if (toCurrency === 'bitcoin') currentUser.balance_bitcoin += toAmount;
      if (toCurrency === 'hrsd') currentUser.balance_hrsd += toAmount;
      
      updateUserInLocalStorage(currentUser);
      
      const fromName = getCurrencyName(fromCurrency);
      const toName = getCurrencyName(toCurrency);
      const message = `Waxaad kala badalatay ${fromAmount.toFixed(2)} ${fromName} iyo ${toAmount.toFixed(5)} ${toName}`;
      
      document.getElementById('swap-message').textContent = message;
      document.getElementById('swap-message').classList.remove('hidden');
      
      setTimeout(() => {
        document.getElementById('swap-modal').classList.add('hidden');
        document.getElementById('swap-from-amount').value = '';
        document.getElementById('swap-to-amount').textContent = '0.00';
        document.getElementById('swap-message').classList.add('hidden');
      }, 3000);
    }

    init();
  </script>
